[build-system]
requires = ["hatchling>=1.27", "uv-dynamic-versioning>=0.9"]
build-backend = "hatchling.build"

[project]
name = "mutts"
dynamic = ["version"]
description = "Metadata for User facility Template Transformations"
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = "MIT"
authors = [
    { name = "Sujay Patil", email = "spatil@lbl.gov" },
    { name = "Cristina Stone Pedraza", email = "cristina.stonepedraza@pnnl.gov" },
    { name = "Montana Smith", email = "montana.smith@pnnl.gov" },
]
keywords = ["NMDC", "US DOE user facilities", "metadata translation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1.7,<9.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "pandas>=2.2.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "requests>=2.32.0,<3.0.0",
]

[project.scripts]
mutts = "mutts.cli:cli"

[project.urls]
Homepage = "https://github.com/microbiomedata/metadata-for-user-facility-template-transformations"
Repository = "https://github.com/microbiomedata/metadata-for-user-facility-template-transformations"

[dependency-groups]
dev = ["pytest>=9.1.1,<10.0.0"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"

[tool.pytest]
addopts = ["-m", "not integration"]
markers = [
    "integration: tests that make authenticated requests to an external NMDC service",
]
